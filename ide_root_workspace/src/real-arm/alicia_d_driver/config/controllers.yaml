joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
  joints:
    - Joint1
    - Joint2
    - Joint3
    - Joint4
    - Joint5
    - Joint6
    - right_finger
    

alicia_controller:
  type: position_controllers/JointTrajectoryController
  state_publish_rate: 50
  action_monitor_rate: 20
  stop_trajectory_duration: 0.5
  joints:
    - Joint1
    - Joint2
    - Joint3
    - Joint4
    - Joint5
    - Joint6
  constraints:
    # The serial hardware can settle about 0.026 rad from the MoveIt endpoint
    # after large wrist-camera pregrasp moves. Keep this tight enough for grasp
    # staging, but avoid aborting a valid pregrasp at the 0.025 rad boundary.
    goal_time: 8.0
    stopped_velocity_tolerance: 0.03
    Joint1: {trajectory: 0.12, goal: 0.03}
    Joint2: {trajectory: 0.12, goal: 0.03}
    Joint3: {trajectory: 0.12, goal: 0.03}
    Joint4: {trajectory: 0.12, goal: 0.03}
    Joint5: {trajectory: 0.12, goal: 0.03}
    Joint6: {trajectory: 0.12, goal: 0.03}

hand_controller:
  type: position_controllers/JointTrajectoryController
  state_publish_rate: 50
  action_monitor_rate: 20
  joints:
    - right_finger
