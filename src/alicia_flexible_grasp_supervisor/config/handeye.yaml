handeye:
  # eye-on-hand: easy_handeye 标定的是 T_tool0_camera_link。
  # 位姿估计优先走 TF 链 camera_link -> tool0 -> base_link；下面的 xyz/q 仅作为 TF 查询失败时的兜底。
  mode: "eye_on_hand"
  base_frame: "base_link"
  parent_frame: "tool0"
  camera_frame: "camera_link"
  child_frame: "camera_link"
  calibration_file: "~/.ros/easy_handeye/d405_cc200_recalib_20260809_eye_on_hand.yaml"
  # 2026-08-10 CC200 pruned-27 formal deployment. Original samples 8, 26
  # and 27 were excluded after raw-sample backup. The OpenCV/Park result
  # passed the five-fold 3/5 mm and 1/2 deg contract at 2.812/4.606 mm and
  # 0.863/1.351 deg.
  translation_xyz: [-0.08327671107922277, 0.004843742371779117, -0.12907560357461276]
  rotation_xyzw: [0.005929097277682129, -0.7167581240677906, 0.018061735450252286, 0.6970627024169479]
  publish_static_tf: true
  use_tf: true
  # 感知线程只处理最新帧后，使用最新 TF 可避免时间戳 TF 查询失败时落到错误静态兜底。
  tf_lookup_latest: true
  # 静态 handeye 只描述 tool0 -> camera_link，不能单独当作 base 坐标发布。
  allow_static_fallback: false
  tf_timeout_sec: 0.2
