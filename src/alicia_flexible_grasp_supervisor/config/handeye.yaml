handeye:
  # eye-on-hand: easy_handeye 标定的是 T_tool0_camera_link。
  # 位姿估计优先走 TF 链 camera_link -> tool0 -> base_link；下面的 xyz/q 仅作为 TF 查询失败时的兜底。
  mode: "eye_on_hand"
  base_frame: "base_link"
  parent_frame: "tool0"
  camera_frame: "camera_link"
  child_frame: "camera_link"
  calibration_file: "~/.ros/easy_handeye/d405_cc200_recalib_20260802_eye_on_hand.yaml"
  # 2026-08-02 operator-authorized pruned-28 provisional deployment. Samples
  # 1 and 30 were excluded and the Daniilidis result was persisted for
  # continued testing. Rotation passes the internal gate, but translation
  # cross-validation remains outside the formal 3/5 mm RMS/maximum contract
  # at 3.146/5.609 mm; this is not a formal calibration pass.
  translation_xyz: [-0.07871787621671505, 0.005044897787180159, -0.13783896256445793]
  rotation_xyzw: [0.020886305332462274, -0.7227629402161271, 0.02978465572232033, 0.6901379346066996]
  publish_static_tf: true
  use_tf: true
  # 感知线程只处理最新帧后，使用最新 TF 可避免时间戳 TF 查询失败时落到错误静态兜底。
  tf_lookup_latest: true
  # 静态 handeye 只描述 tool0 -> camera_link，不能单独当作 base 坐标发布。
  allow_static_fallback: false
  tf_timeout_sec: 0.2
